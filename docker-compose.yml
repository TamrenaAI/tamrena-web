version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: tamreena-web-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tamreena-web-backend
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tamreena-web-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    depends_on:
      - backend

volumes:
  mongo_data:
